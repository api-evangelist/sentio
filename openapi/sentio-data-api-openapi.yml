  /v1/analytics/{owner}/{slug}/sql/execute:
    post:
      description: 'Execute SQL in a project. Go to "Data Studio" -> "SQL Editor", write your query and then click "Export as cURL"


        ![screenshot](https://media.githubusercontent.com/media/sentioxyz/docs/HEAD/assets/image%20(102).png)


        Find more: https://docs.sentio.xyz/reference/data#sql-api'
