openapi: 3.0.0
info:
  title: Sentio AI Data API
  description: 'Sentio Open API — REST access to Sentio''s Web3 observability platform: analytics (SQL/metrics/event logs), price data, processors, dashboards, alerts, debugging/simulation (forks), and AI chat. Harvested from Sentio''s published API reference at docs.sentio.xyz/reference.'
  version: '1.0'
  contact:
    name: Sentio
    url: https://www.sentio.xyz
servers:
- url: https://api.sentio.xyz
tags:
- name: Data
paths:
  /v1/analytics/{owner}/{slug}/sql/cancel_query/{executionId}:
    put:
      description: Cancel a SQL query by execution_id.
      operationId: CancelSQLQuery
      parameters:
      - description: username or organization name
        in: path
        name: owner
        required: true
        schema:
          type: string
      - description: project slug
        in: path
        name: slug
        required: true
        schema:
          type: string
      - in: path
        name: executionId
        required: true
        schema:
          type: string
      - description: use project id if project_owner and project_slug are not provided
        in: query
        name: projectId
        required: false
        schema:
          type: string
      - description: version of the datasource, default to the active version if not provided
        in: query
        name: version
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                properties: {}
                type: object
      summary: Cancel SQL Query
      tags:
      - Data
