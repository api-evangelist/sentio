      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                properties: {}
                type: object
      summary: Delete Refreshable Materialized View
      tags:
      - Data
    get:
      description: Get the status of a refreshable materialized view in a project.
      operationId: GetRefreshableMaterializedStatus
      parameters:
