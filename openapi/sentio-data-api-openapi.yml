        description: find more information here
        url: https://docs.sentio.xyz/reference/data#sql-api
      operationId: ExecuteSQL
      parameters:
      - description: username or organization name
        in: path
        name: owner
        required: true
        schema:
          type: string
      - description: project slug
        in: path
        name: slug
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/analytic_service.AnalyticService.ExecuteSQLBody'
        required: true
      responses:
        '200':
          description: A successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/analytic_service.SyncExecuteSQLResponse'
      summary: Execute SQL
      tags:
      - Data
