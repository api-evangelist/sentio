aid: sentio
name: Sentio
description: Sentio is a developer-first, AI-powered Web3 data and observability platform for building,
  monitoring, and debugging on-chain applications. It provides indexing processors and hosted subgraphs
  across EVM, Aptos, Sui, IOTA, Solana and Fuel; a Data API that turns SQL or GraphQL into REST endpoints;
  metrics, event logs, dashboards and alerts; a crypto price API; and a transaction debugger with forks,
  simulations and call-trace/fund-tracing tools. Sentio exposes a REST API at api.sentio.xyz (api-key
  auth), TypeScript SDK and CLI, webhooks, and an official Model Context Protocol server. Backed by Lightspeed
  Faction and added to the API Evangelist network; profile enriched from Sentio's published developer
  surface.
